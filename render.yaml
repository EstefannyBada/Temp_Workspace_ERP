# render.yaml
# Documentación: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: erp-django-utec
    runtime: python
    plan: free                     # plan gratuito para desarrollo académico
    region: oregon                 # us-west región gratuita de Render
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && (python manage.py createsuperuser --noinput || true)
    startCommand: gunicorn core.wsgi --workers 2 --timeout 120 --log-file -
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings_prod
      - key: SECRET_KEY
        generateValue: true        # Render genera una clave aleatoria segura
      - key: DATABASE_URL
        fromDatabase:
          name: erp-django-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@erp.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false                # se captura en el Dashboard, no va en Git
      - key: PYTHON_VERSION
        value: "3.12.8"

databases:
  - name: erp-django-db
    databaseName: erp_db
    user: erp_user
    plan: free                     # PostgreSQL gratuito en Render (90 días)
    region: oregon
