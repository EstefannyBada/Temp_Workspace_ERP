{% extends "base.html" %}
{% block title %}Error en el pago{% endblock %}

{% block content %}
<div style="display:flex;justify-content:center;align-items:center;min-height:60vh;">
    <div class="erp-card" style="max-width:480px;text-align:center;">
        <div style="font-size:4rem;margin-bottom:1rem;">❌</div>
        <h2 style="font-family:'Playfair Display',serif;color:var(--clr-danger);margin:0 0 .5rem;">
            Error en el pago
        </h2>
        <p style="color:var(--clr-muted);margin-bottom:1.5rem;">
            No pudimos procesar tu pago. Tu carrito sigue intacto.
        </p>

        <div class="d-flex gap-2 justify-content-center">
            <a href="{% url 'catalogo:carrito' %}" class="btn-erp-primary">← Volver al carrito</a>
            <a href="{% url 'catalogo:checkout' %}" class="btn-erp-gold">Reintentar pago</a>
        </div>
    </div>
</div>
{% endblock %}
